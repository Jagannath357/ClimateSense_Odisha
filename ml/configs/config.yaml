project_name: ClimateSense Odisha
data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  reports_dir: outputs/reports
  figures_dir: outputs/figures
  metrics_dir: outputs/metrics
  supported_extensions: [.csv]
  missing_sentinel: -999
  max_forecast_data_gap_days: 7
  climatology_baseline_start: 2001
  climatology_baseline_end: 2010
  source_name: NASA POWER daily local exports
split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  strategy: chronological_global
  random_seed: 42
